<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18211A">
<meta name="description" content="BeeMap Heilbronn: a public map for bees. Asian hornet alerts and nest areas, wild-bee zones, flower gaps, what to plant, and where hives fit.">
<title>BeeMap Heilbronn</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.5 L20.5 7.25 V16.75 L12 21.5 L3.5 16.75 V7.25 Z' fill='%23F2C230'/%3E%3Ccircle cx='12' cy='12' r='2.6' fill='%2318211A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/spa.css">
</head>
<body>
<div id="map" role="application" aria-label="Map of Heilbronn"></div>

<div class="topbar">
  <form class="search" id="search" role="search">
    <span class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2.5 L20.5 7.25 V16.75 L12 21.5 L3.5 16.75 V7.25 Z" fill="#F2C230"/><circle cx="12" cy="12" r="2.6" fill="#18211A"/></svg><span>BeeMap</span></span>
    <label for="q" class="sr-only">Search a place in Heilbronn</label>
    <input id="q" placeholder="Search Heilbronn" autocomplete="off">
    <button class="iconbtn" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55605A" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20 L16 16"/></svg></button>
  </form>
</div>
<button class="fab" id="layersbtn" aria-expanded="false" aria-controls="layers"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#18211A" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 L21 8 L12 13 L3 8 Z M3 13 L12 18 L21 13"/></svg>Layers</button>
<button class="fab report" id="reportbtn" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linejoin="round"><path d="M4 8 H7 L8.5 6 H15.5 L17 8 H20 V18 H4 Z"/><circle cx="12" cy="13" r="3.2"/></svg>Report a nest</button>
<div class="pickbar" id="pickbar" hidden role="status"><span>Tap the map where the nest is</span><button class="btn ghost sm" id="pickcancel">Cancel</button></div>
<section class="layers" id="layers" hidden aria-label="Map layers and filters"></section>

<aside class="panel" id="panel" aria-label="Information panel">
  <button class="grab" id="grab" aria-label="Expand or shrink the panel"></button>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="pbody" id="pbody"></div>
</aside>
<button class="collapse" id="collapse" aria-label="Hide the panel">‹</button>
<div class="legend" id="legend" aria-label="Legend"></div>
<div class="status" id="status" role="status" aria-live="polite" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/spa.js"></script>
</body>
</html>
