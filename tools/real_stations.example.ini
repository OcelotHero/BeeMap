; Real Raspberry Pi stations for the demo (tools/demo.py, ./pitch.sh).
;
; pitch.sh starts from an empty database every time, so a real Pi would be
; "not registered" and its hornets refused. The demo registers every station
; listed here next to the simulated hives; their hornets then reach the map
; live, on top of the simulated ones.
;
; Copy this file to tools/real_stations.ini (not in git: it holds the tokens).
; One section per Pi; the section name is the station_id in the Pi's beemap.ini.

[hornet-pi]
name = HornTrac station, OpenSpace
lat = 49.146
lon = 9.212
; compass direction of the heading camera (sky: image top; horizon: image centre),
; or of the detection camera's image top on a single-camera station
heading = 0
; the same value as token= in the Pi's beemap.ini: 16+ letters, digits, - or _
; make one with:  python3 -c "import secrets; print(secrets.token_urlsafe(24))"
; leave empty to get a new one printed at every start
token =
