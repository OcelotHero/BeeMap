; BeeMap station config. Copy to beemap.ini and fill in the first three lines.
[beemap]
; Where the BeeMap server runs (laptop, home server, or cloud VM)
server = http://192.168.1.50:8000
; Create the station in the app (Stations > Add station), then paste both here
station_id = hive2-boeckingen
token = paste-the-token-from-the-app

; VespAI YOLOv5 weights and the class name for the Asian hornet
weights = models/vespai.pt
; Local checkout of ultralytics/yolov5 at commit 23701eac. The VespAI weights only
; load with that version; leave empty to fetch the (newer, incompatible) GitHub one.
yolov5_dir = yolov5
target_class = velutina
; VespAI's own field setting is 0.8. Below that it boxes hair, flowers and bottles.
min_confidence = 0.8

; DETECTION CAMERA: runs VespAI at the hive entrance or bait station
; picamera2 | picamera2:0 | opencv:0 | file:/path/to/test-video.mp4
camera = picamera2:0
width = 1280
height = 720
fps = 10
; rotate the image clockwise: 0 | 90 | 180 | 270 (set the heading in the app after rotating)
rotate = 0
; Camera Module 3: continuous autofocus
autofocus = true
; live view with boxes for aiming the camera: http://<pi>:8080/  (0 = off; no login)
stream_port = 0

; HEADING CAMERA: external camera that follows the hornet as it flies off.
; picamera2:1 (Pi 5 second port) | opencv:1 (USB) | none (single-camera station)
heading_camera = picamera2:1
; sky = fisheye looking straight up (sees every direction)
; horizon = looking outward (more precise, but only sees its field of view)
heading_mode = sky
heading_hfov = 120
heading_flip = false
heading_fps = 30
; seconds after leaving the detection camera that its flight must appear here
match_window_s = 3

; A hornet missing for this long has left. Raise it if detections flicker.
lost_after_s = 0.6
min_track_points = 4
heartbeat_s = 60
send_live_frame = true
queue_dir = queue

; Only used with --simulate
sim_nest_bearing = 135
sim_heading = 0
sim_rate_per_min = 2

; COLONY HEALTH: sensor inside the hive and entrance activity
; none | bme280 (I2C) | sht31 (I2C) | dht22 (GPIO pin)
hive_sensor = bme280
hive_sensor_addr = 0x76
hive_sensor_pin = D4
; where the entrance is in the detection image: x0,y0,x1,y1 as fractions (0..1)
entrance_roi = 0,0.55,1,1
bee_blob_min_px = 20
bee_blob_max_px = 3000
hive_post_s = 300
